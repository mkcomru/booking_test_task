repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: scripts/
      - id: ruff-format
        exclude: scripts/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-files"
          - "(node_modules|\\.ruff_cache|\\.venv|uv\\.lock|scripts/manual_testing|plans|alembic|tests)"
        exclude: "(?x)(^(.*/)?migrations/|\\.env\\.test|\\.env\\.example|\\.md|^plans/|^alembic/|^tests/)"
